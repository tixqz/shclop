apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: integrationplugins.shclop.io
spec:
  group: shclop.io
  scope: Cluster
  names:
    plural: integrationplugins
    singular: integrationplugin
    kind: IntegrationPlugin
    shortNames:
      - ipl
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                id:
                  type: string
                  description: Unique plugin identifier (lowercase alphanumeric + hyphens).
                display_name:
                  type: string
                  description: Human-readable display name shown in the UI.
                description:
                  type: string
                kind:
                  type: string
                  enum: [http_template, sidecar]
                  description: Plugin kind — http_template or sidecar.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                lastSyncedAt:
                  type: string
                  format: date-time
                message:
                  type: string
