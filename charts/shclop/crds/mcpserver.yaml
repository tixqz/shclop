apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpservers.shclop.io
spec:
  group: shclop.io
  scope: Namespaced
  names:
    plural: mcpservers
    singular: mcpserver
    kind: MCPServer
    shortNames:
      - mcp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              required:
                - image
                - port
              properties:
                image:
                  type: string
                  description: Container image for the MCP server.
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: Port the MCP server listens on.
                replicas:
                  type: integer
                  minimum: 0
                  description: Number of replicas (defaults to 1 when 0 or unset).
                serviceAccountName:
                  type: string
                  description: ServiceAccount to assign to the MCP server pod.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                serviceURL:
                  type: string
                  description: Cluster-internal URL of the MCP server service.
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
